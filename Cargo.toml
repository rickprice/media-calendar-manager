[package]
name = "media-calendar-manager"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
# Web & Async Runtime
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }

# Database (PostgreSQL)
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid"
] }

# Auth & Sessions
axum-login = "0.19"
tower-sessions = "0.15"
tower-sessions-sqlx-store = { version = "0.16", features = ["postgres"] }
password-auth = "2.0"

# HTML Templating
askama = "0.16"

# Utilities
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_urlencoded = "0.7"
